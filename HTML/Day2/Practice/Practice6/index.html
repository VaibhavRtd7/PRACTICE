<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive audio and video embedding example">
  <title>Responsive Media Embedding</title>
  <style>

body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
 
    h1 {
      text-align: center;
      margin: 20px;
    }
 
    .media-container {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
    }
 
    audio, video {
      width: 100%;
      max-width: 100%;
      /* height: auto; */
      border: 2px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
 
    footer {
      text-align: center;
      margin: 20px 0;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1>Responsive Audio and Video Embedding</h1>
  </header>
 
  <main>
    <!-- Audio Section -->
    <section class="media-container">
      <h2>Audio Player</h2>
      <audio controls autoplay>
            <source src="../audio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
      </audio>
      
    </section>
 
    <!-- Video Section -->
    <section class="media-container">
      <h2>Video Player</h2>
      <video controls preload="auto" autoplay muted>
        <source src="../video-file.mp4" type="video/mp4">
        <source src="../video-file2.mp4" type="video/ogg">
        Your browser does not support the video element.
      </video>
    </section>
  </main>
 
  <footer>
    <p>&copy; 2025 Vaibhav's Media Page</p>
  </footer>
</body>
</html>
