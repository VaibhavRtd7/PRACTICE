<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Employee Details</title>
</head>
<style>
     body {
        margin: 0;
        padding: 0;
        font-family :Arial, Helvetica, sans-serif;
     }

     .container {
        margin : 40px auto;
        padding: 30px;
        max-width: 600px;
        border : 2px solid black;
        border-radius: 1px;
     }

     h2{
        text-align: center;
        text-decoration: underline;
     }
</style>
<body>
    <div class="container">
        <h2> Employee Details </h2>
        <form>
            <label for="fname"> Enter Your First Name : </label>
            <input type="text" id="fname" name="fname"></input>  <br><br>
            
            <label for="lname"> Enter Your Last Name : </label>
            <input type="text" id="lname" name="lname">  <br><br>

            <label for="age"> Enter your age : </label>
            <input type="number" id="age" name="age"> <br><br>
             
            <label for="gender"> Your Gender : 
                <input type="radio"> <label > Male </label>
                <input type="radio"> <label > Female </label>
            </label>  <br><br>

            <label for="department"> Enter your Department : </label>
            <select id="department" name="department">
                <option value="DotNet"> DotNet </option>
                <option value="MERN"> MERN </option>
                <option value="PHP"> PHP </option>
                <option value="PHP"> Data Analyst </option>
            </select> <br><br>

            <label for="salary"> Enter your salary : </label>
            <input type="number" id="salary" name="salary"> <br><br>

            <label for="date"> Date of joining : </label>
            <input type="date" id="date" name="date"> <br><br>

            <label for="location"> Enter your Location : </label>
            <input type="text" id="location" name="location"> <br><br>

            <label for="contact"> Contact Number : </label>
            <input type="telNo" id="contact" name="contact" maxlength="10" required> <br><br>
             
            <label> 
            <input type="submit">
        </form>
    </div>
</body>
</html>
