<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
    }
    
    .container {
        padding: 20px;
        text-align: left;
        border: 1px solid black;
        width: 50%;
    }
</style>
<body>
    
   <div class="container">
       <h2> Employee Details </h2>
       <form>
    
           <label for="department"> Enter your Department : </label>
           <select id="department" name="department">
               <option value="DotNet"> DotNet </option>
               <option value="MERN"> MERN </option>
               <option value="PHP"> PHP </option>
               <option value="PHP"> Data Analyst </option>
           </select> <br><br>
    
           <label for="fname"> First Name : </label>
           <input type="text" id="fname" name="fname"></input>  <br><br>
           
           <label for="lname"> Last Name : </label>
           <input type="text" id="lname" name="lname">  <br><br>
    
           <label for="age"> Age : </label>
           <input type="number" id="age" name="age" min="10"> <br><br>
            
           <span>  Gender : </span>
               <input type="radio" id="male"> <label for="male"> Male </label>
               <input type="radio" id="female"> <label for="female"> Female </label>
          <br><br>
    
           <label for="date"> Date of joining : </label>
           <input type="date" id="date" name="date"> <br><br>
           
    
           <label for="salary"> Current salary : </label>
           <input type="number" id="salary" name="salary" min="1"> <br><br>
    
           <label for="contact"> Contact Number : </label>
           <input type="telNo" id="contact" name="contact" maxlength="10" required> <br><br>
    
           <label for="location"> Enter your Location : </label>
           <input type="text" id="location" name="location"> <br><br>
    
           <input type="submit">
       </form>
   </div>


</body>
</html>
