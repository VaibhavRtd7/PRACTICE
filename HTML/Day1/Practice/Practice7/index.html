<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in HTML </title>
</head>
<style>
   
table, th, td {
    border: 1px solid black;
    border-collapse: collapse;
}

caption {
    font-size: 30px;
    font-weight: 700;
}

th, td {
    padding: 4px 8px;
}
    

</style>
<body>
      <table>
        <caption> Employee Details </caption>
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Department</th>
                <th>Contact Number</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <td>Vaibhav Rathod</td>

                <td>90909 09090</td>
            </tr>
            <tr>
                <th>2</th>
                <td>Sarthak Kalasva</td>
                <td>MBA</td>
                <td> 89898 90908 </td>
            </tr>
            <tr>
                <th>3</th>
                <td>Mayur Rathod</td>
                <td> Manager </td>
                <td>90554 12321</td>
            </tr>
            <tr>
                <th>4</th>
                <td>Rishi Patel</td>

            </tr>
        </tbody>
      </table>
</body>
</html>
