<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card</title>
</head>

<style>
    
    body {
        margin: 0;
        padding: 0;
        font-family :Arial, Helvetica, sans-serif;
    }

    .container {
        max-width: 500px;
        margin: 20px auto;
        padding: 10px 5px;
        border: 2px solid black;
    }

    h2 {
        text-align: center;
    }
    
    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }

</style>
<body>
  <div class="container">
    <h2> Student Report Card </h2>
        <form>
            <label for="fname"> Enter your full Name : </label>
            <input type="text" id="fname" name="fname"></input>  <br><br>

            <label for="department"> Select your Department : </label>
            <select id="department" name="department">
                <option value="DotNet"> DotNet </option>
                <option value="MERN"> MERN </option>
                <option value="PHP"> PHP </option>
                <option value="PHP"> Data Analyst </option>
            </select> <br><br>
            
            <label for="rollno"> Roll No : </label>
            <input type="number" id="rollno" name="rollno" min="0" max="1000" > <br><br>
             

            <label for="rollno"> Year of passing :  </label>
            <input type="number" id="rollno" name="rollno" min="2018" max="2024"> <br><br>
            
                <table>
                    <caption>Subject Marks : </caption>
                    <tr>
                        <th>  Subject Name</th>
                        <th> Marks</th>
                        <th> Grade </th>
                    </tr>
                    <tr>
                        <td> JAVA </td>
                        <td> 85 </td>
                        <td>  8.5  </td>
                    </tr>
                    <tr>
                        <td>  C++ </td>
                        <td> 91 </td>
                        <td> 9.1 <br>   </td>
                    </tr>
                    <tr>
                        <td> Python </td>
                        <td> 88 </td>
                        <td> 8.8 <br></td>
                    </tr>
                    <tr>
                        <td>  Reactjs </td>
                        <td> 92 </td>
                        <td> 9.2 <br>   </td>
                    </tr>
                </table>
             <br><br>

             <label for="gender"> Your Gender : 
                <input type="radio"> <label > Male </label>
                <input type="radio"> <label > Female </label>
            </label>  <br><br>

            <label for="contact"> Contact Number : </label>
            <input type="tel" id="contact" name="contact" pattern="[0-9]{10}" required> <br><br>
             
            <label> 
            <input type="submit">
        </form>
    
  </div>
</body>
</html>
