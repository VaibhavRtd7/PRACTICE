<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order and Unorder list</title>
</head>
<style>
   
   body {
    font-size: 28px;
   }

   ol{
    color:rgb(75, 5, 161);
   }

   ul{
    color: rgb(62, 121, 4);
   }

</style>
<body>
      <h3> Order list</h3>
      <ol>
        <li> Apple </li>
        <li> Banana </li>
        <li> Mango </li>
        <li> Pineple </li>
        <li> Guawa </li>
        <li> Orange </li>
      </ol>
      
      <h3> Unorder List </h3>
      <ul>
        <li> Apple </li>
        <li> Banana </li>
        <li> Mango </li>
        <li> Pineple </li>
        <li> Guawa </li>
        <li> Orange </li>
      </ul>
</body>
</html>
