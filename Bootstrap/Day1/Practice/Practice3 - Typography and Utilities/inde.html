<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Typography and Utilities : Text Alignment & Display </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
      
    
  <div class="container">

    <!-- DISPLAY CLASSES -->
    <h1 class="display-1">Display 1</h1>
    <h1 class="display-2">Display 2</h1>
    <h1 class="display-3">Display 3</h1>
    <h1 class="display-4">Display 4</h1>
    
    <br><br>

    <p class="text-start"> start Text</p>
    <p class="text-center"> Center Text</p>
    <p class="text-end"> end Text</p>

    <br><br>
    
    <p class="text-sm-start"> text-sm-start </p>
    <p class="text-md-start"> txt-md-start </p>
    <p class="text-lg-start"> text-lg-start </p>
    <p class="text-xl-start"> text-xl-start </p>
    
    <br><br>
    <p class="text-sm-end"> text-sm-end </p>
    <p class="text-md-end"> txt-md-end </p>
    <p class="text-lg-end"> text-lg-end </p>
    <p class="text-xl-end"> text-xl-end </p>

    <br><br>
    <p class="text-sm-center"> text-sm-center </p>
    <p class="text-md-center"> txt-md-center </p>
    <p class="text-lg-center"> text-lg-center </p>
    <p class="text-xl-center"> text-xl-center </p>
    
    <br>
   
  </div>
    
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>


</body>
</html>
